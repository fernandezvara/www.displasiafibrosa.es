<!-- Cookie Consent Banner - Bilingual (ES/EN) -->
<div id="cookie-consent-banner" class="cookie-consent-banner" role="alertdialog" aria-live="polite" aria-label="Consentimiento de cookies / Cookie Consent" hidden>
  <div class="consent-content">
    <div class="consent-text">
      <p class="consent-text-es">
        Utilizamos cookies para analizar el tráfico y mejorar tu experiencia. 
        Al hacer clic en "Aceptar", permites el uso de Google Analytics.
        <a href="/politica-cookies" class="consent-link">Más información</a>
      </p>
      <p class="consent-text-en">
        We use cookies to analyze traffic and improve your experience. 
        By clicking "Accept", you allow the use of Google Analytics.
        <a href="/politica-cookies" class="consent-link">Learn more</a>
      </p>
    </div>
    <div class="consent-buttons">
      <button class="btn-consent btn-consent-accept" onclick="cookieConsent.accept()" aria-label="Aceptar cookies / Accept cookies">
        Aceptar / Accept
      </button>
      <button class="btn-consent btn-consent-reject" onclick="cookieConsent.reject()" aria-label="Rechazar cookies / Decline cookies">
        Rechazar / Decline
      </button>
    </div>
  </div>
</div>
